minimum_pre_commit_version: 3.2.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        files: ^(?:AGENTS\.md|PROJECT_RULES\.md|docs/|tools/|\.github/|\.pre-commit-config\.yaml)$
      - id: end-of-file-fixer
        files: ^(?:AGENTS\.md|PROJECT_RULES\.md|docs/|tools/|\.github/|\.pre-commit-config\.yaml)$

  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: b7a4935fc6483d51837f7080598dad456f4f7645 # 4.5.0
    hooks:
      # Existing legacy scripts are adopted incrementally; data/types is the
      # current clean boundary. gdformat is check-only and never writes here.
      - id: gdlint
        files: ^data/types/.*\.gd$
      - id: gdformat
        args: [--check]
        files: ^data/types/(?!stage_data\.gd$|wave_data\.gd$).*\.gd$
