name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create static tooling environment
        run: python3 -m venv "$RUNNER_TEMP/acidblood-static"

      - name: Install pinned static tooling
        run: |
          "$RUNNER_TEMP/acidblood-static/bin/pip" install \
            pre-commit==4.3.0

      - name: Run static checks and lightweight hooks
        run: |
          "$RUNNER_TEMP/acidblood-static/bin/pre-commit" run --all-files

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Verify Godot version
        run: godot --version

      - name: Run canonical validation
        run: bash tools/validate.sh
